<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Journal — Private Bible Journal</title>
<meta name="description" content="A private Bible journal with Scripture links. Entries are saved only on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e7; --surface:#fffdf8; --surface-2:#efe7d6; --ink:#2a241c; --muted:#6f6555;
  --line:#ddd2bd; --accent:#7a3b2e; --accent-ink:#fff; --accent-soft:#f2e2da; --ok:#3d6b45;
  --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 20px rgba(60,40,20,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1814; --surface:#24201b; --surface-2:#2e2922; --ink:#eee6d8; --muted:#a89c88;
  --line:#3a342b; --accent:#d9937f; --accent-ink:#1b1814; --accent-soft:#3a2a24; --ok:#8cc596;
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface-2)}
.brand{font-family:var(--serif);font-size:1.5rem;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.brand-sub{color:var(--muted);font-size:.85rem;margin:0 0 22px}
.nav-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 6px 8px}
.week-btn{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.week-btn:hover{background:var(--surface)}
.week-btn[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.week-btn .wk{font-size:.75rem;color:var(--muted)}
.week-btn .wt{display:block;font-weight:500;font-size:.95rem}
.week-btn .dot{float:right;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px}
.side-actions{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.small{padding:6px 10px;font-size:.82rem}
main{padding:40px clamp(18px,5vw,64px) 80px;max-width:860px;width:100%}
.topbar{display:none}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.88rem;margin-bottom:28px}
.privacy svg{flex:none;margin-top:2px}
.eyebrow{color:var(--accent);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.15;margin:6px 0 10px;letter-spacing:-.015em}
.intro{color:var(--muted);font-family:var(--serif);font-size:1.12rem;margin:0 0 20px}
.passages{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.9rem;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.version{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;margin:10px 0 30px}
.version select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.q-num{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
.q-text{font-family:var(--serif);font-size:1.18rem;line-height:1.4;margin:4px 0 6px}
.q-refs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.q-refs a{font-size:.82rem;text-decoration:none;border-bottom:1px solid transparent}
.q-refs a:hover{border-color:currentColor}
label.field{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);line-height:1.55;font-size:1rem}
textarea.short{min-height:56px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.saved{font-size:.78rem;color:var(--ok);height:1em;margin-top:6px}
.section-h{font-family:var(--serif);font-size:1.3rem;margin:34px 0 12px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.journal-entry{border-top:1px solid var(--line);padding:14px 0}
.journal-entry:first-child{border-top:0}
.journal-entry .q-text{font-size:1.02rem}
.journal-entry p{margin:4px 0;white-space:pre-wrap}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.edit-q{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
.edit-q .refs{grid-column:1}
.hint{color:var(--muted);font-size:.82rem;margin:4px 0 0}
.warn{background:#f6e3b8;color:#4a3a10;border-radius:var(--r);padding:12px 14px;font-size:.88rem;margin-bottom:20px}
dialog{border:0;border-radius:16px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,15,10,.45)}
.dlg{padding:22px}
.dlg h2{font-family:var(--serif);margin:0 0 8px;font-size:1.35rem}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.lock-screen{max-width:380px;margin:12vh auto;text-align:center}
.lock-screen input{text-align:center;font-size:1.2rem;letter-spacing:.3em;margin:14px 0}
.err{color:#b3261e;font-size:.85rem;min-height:1.2em}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:20;transform:translateX(-100%);transition:transform .25s ease}
  aside.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  .scrim.show{display:block}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  .topbar .brand{font-size:1.15rem;margin:0}
  main{padding-top:22px}
}
@media print{aside,.topbar,.toolbar,.privacy,.version,.btn{display:none!important}.app{display:block}textarea{border:0;padding:0;min-height:0}}

.entry-btn{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.entry-btn:hover{background:var(--surface)}
.entry-btn[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.entry-btn .wk{font-size:.75rem;color:var(--muted)}
.entry-btn .wt{display:block;font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{margin:4px 0 8px}
.title-input{font-family:var(--serif);font-weight:600;font-size:clamp(1.6rem,4vw,2.3rem);border:0;background:none;padding:4px 0;width:100%;letter-spacing:-.015em}
.title-input:focus{outline:none;border-bottom:2px solid var(--accent)}
.meta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:.88rem;margin:4px 0 18px}
.meta-row input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.linked{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.linked a{font-size:.85rem}
.home-list .card{cursor:pointer}
.home-list .card:hover{border-color:var(--muted)}
.home-list .preview{color:var(--muted);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="topbar">
  <button class="btn small" id="menuBtn" aria-label="Open entries">☰ Entries</button>
  <p class="brand">Study Journal</p>
  <button class="btn small primary" data-new>+ New</button>
</div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside id="side">
    <p class="brand">Study Journal</p>
    <p class="brand-sub">A private place to reflect on God’s Word</p>
    <button class="btn primary" data-new style="width:100%">+ New entry</button>
    <button class="btn ghost" data-home style="width:100%;text-align:left;margin-top:6px">All entries</button>
    <input type="text" id="search" class="search" placeholder="Search entries…" aria-label="Search entries">
    <div class="nav-label">Entries</div>
    <nav id="entryList"></nav>
    <div class="nav-label">My data</div>
    <div class="side-actions">
      <button class="btn small" id="exportBtn">Back up my journal</button>
      <button class="btn small" id="importBtn">Restore from backup</button>
      <button class="btn small" id="lockBtn">Set passcode lock</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
(() => {
"use strict";
/* Private storage: everything stays in this browser on this device. Nothing is sent anywhere. */
const K = { entries:'sj.entries.v1', prefs:'sj.prefs.v2', lock:'sj.lock.v1' };
let storageOK = true; const mem = {};
try { localStorage.setItem('sj.test','1'); localStorage.removeItem('sj.test'); } catch(e){ storageOK = false; }
const get = k => { try { const v = storageOK ? localStorage.getItem(k) : mem[k]; return v ? JSON.parse(v) : null; } catch(e){ return null; } };
const set = (k,v) => { const s = JSON.stringify(v); if (storageOK) { try { localStorage.setItem(k,s); } catch(e){ mem[k]=s; } } else mem[k]=s; };
const del = k => { if (storageOK) localStorage.removeItem(k); else delete mem[k]; };

/* Bible links */
const VERSIONS = ['ESV','NIV','NLT','NKJV','KJV','CSB','NASB','MSG'];
const bibleUrl = (ref, v) => `https://www.biblegateway.com/passage/?search=${encodeURIComponent(ref)}&version=${v}`;
const BOOKS = 'Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|[12] ?Samuel|[12] ?Kings|[12] ?Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Song of Solomon|Song of Songs|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|[12] ?Corinthians|Galatians|Ephesians|Philippians|Colossians|[12] ?Thessalonians|[12] ?Timothy|Titus|Philemon|Hebrews|James|[12] ?Peter|[123] ?John|Jude|Revelation|Gen|Ex|Lev|Num|Deut|Josh|Judg|Ps|Prov|Eccl|Isa|Jer|Lam|Ezek|Dan|Matt|Mk|Lk|Jn|Rom|Gal|Eph|Phil|Col|Heb|Jas|Rev';
const REF_RE = new RegExp(`\\b(${BOOKS})\\.? (\\d{1,3})(?::(\\d{1,3})(?:[-–](\\d{1,3}))?)?\\b`, 'gi');
const findRefs = text => { const out = new Set(); for (const m of String(text||'').matchAll(REF_RE)) out.add(m[0].replace('–','-')); return [...out]; };

let entries = get(K.entries) || [];
let prefs = Object.assign({ version:'ESV', current:null, view:'home', q:'' }, get(K.prefs) || {});
const save = () => set(K.entries, entries);
const savePrefs = () => set(K.prefs, prefs);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const fmtDate = d => d ? new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '';
const sorted = () => [...entries].sort((a,b) => (b.date||'').localeCompare(a.date||'') || b.updated - a.updated);
const matches = (e,q) => !q || [e.title,e.scripture,e.reflection,e.god,e.jesus,e.obey,e.prayer,e.takeaway].join(' ').toLowerCase().includes(q.toLowerCase());
const titleOf = e => e.title?.trim() || e.scripture?.trim() || 'Untitled entry';

function renderNav(){
  const list = sorted().filter(e => matches(e, prefs.q));
  $('#entryList').innerHTML = list.length ? list.map(e => `
    <button class="entry-btn" data-entry="${e.id}" aria-current="${prefs.view==='entry' && prefs.current===e.id}">
      <span class="wk">${esc(fmtDate(e.date))}</span><span class="wt">${esc(titleOf(e))}</span></button>`).join('')
    : `<p class="hint" style="padding:0 8px">${prefs.q ? 'No matches.' : 'No entries yet.'}</p>`;
  $('#lockBtn').textContent = get(K.lock) ? 'Change or remove passcode' : 'Set passcode lock';
}
const privacyNote = () => `
  ${storageOK ? '' : '<div class="warn">This browser is blocking private storage, so entries will be lost when you close the page. Open the app directly in Safari or Chrome, or use “Back up my journal” before leaving.</div>'}
  <div class="privacy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  <span><strong>Your journal is private.</strong> Entries are saved only in this browser on this device and are never sent anywhere. No one else using this app can see them.</span></div>`;

function renderHome(){
  const list = sorted().filter(e => matches(e, prefs.q));
  $('#main').innerHTML = privacyNote() + `
    <div class="eyebrow">Private</div><h1>My journal</h1>
    <p class="intro">Read the Word, listen for what God is showing you, and apply it to your life today.</p>
    <div class="toolbar"><button class="btn primary" data-new>+ New entry</button>
      ${entries.length ? '<button class="btn" onclick="print()">Print or save as PDF</button>' : ''}</div>
    <div class="home-list">${list.length ? list.map(e => `
      <section class="card" data-entry="${e.id}" tabindex="0">
        <div class="q-num">${esc(fmtDate(e.date).toUpperCase())}</div>
        <div class="q-text">${esc(titleOf(e))}</div>
        ${e.scripture ? `<div class="hint">📜 ${esc(e.scripture)}</div>` : ''}
        ${e.reflection ? `<p class="preview">${esc(e.reflection)}</p>` : ''}
        ${e.takeaway ? `<p style="margin:6px 0 0"><strong>Takeaway:</strong> ${esc(e.takeaway)}</p>` : ''}
      </section>`).join('') : `<div class="empty">${prefs.q ? 'No entries match your search.' : 'Your journal is empty. Open your Bible, tap “New entry,” and write what God shows you.'}</div>`}</div>`;
}

function renderEntry(){
  const e = entries.find(x => x.id === prefs.current);
  if (!e){ prefs.view='home'; return renderHome(); }
  const v = prefs.version;
  const refsHtml = () => { const refs = [...new Set([...String(e.scripture||'').split(/[;,\n]/).map(s=>s.trim()).filter(Boolean), ...findRefs([e.reflection,e.god,e.jesus,e.obey,e.prayer,e.takeaway].join(' '))])];
    return refs.map(r => `<a class="chip" target="_blank" rel="noopener" href="${bibleUrl(r,v)}">📜 ${esc(r)}</a>`).join(''); };
  $('#main').innerHTML = privacyNote() + `
    <input class="title-input" id="f_title" placeholder="Entry title" value="${esc(e.title)}" aria-label="Entry title">
    <div class="meta-row"><input type="date" id="f_date" value="${esc(e.date)}" aria-label="Date">
      Bible version <select id="ver" style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px">${VERSIONS.map(x => `<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>
      <button class="btn small ghost" id="delEntry" style="color:#b3261e">Delete</button></div>
    <section class="card">
      <label class="field" for="f_scripture">Scripture</label>
      <input type="text" id="f_scripture" placeholder="e.g. Deuteronomy 16; Acts 3:17-26" value="${esc(e.scripture)}">
      <p class="hint">Separate with semicolons. References you mention anywhere in this entry also become links.</p>
      <div class="passages linked" id="refs">${refsHtml()}</div>
    </section>
    <section class="card">
      <label class="field" for="f_reflection">What is this passage saying?</label>
      <textarea id="f_reflection" style="min-height:140px" placeholder="Put the passage in your own words. What stands out?">${esc(e.reflection)}</textarea>
      <label class="field" for="f_god">What does it show me about God?</label>
      <textarea class="short" id="f_god" placeholder="His character, His promises, His faithfulness…">${esc(e.god)}</textarea>
      <label class="field" for="f_jesus">How does it point me to Jesus?</label>
      <textarea class="short" id="f_jesus" placeholder="Where do I see Christ, the Son of God, in this passage or its promise?">${esc(e.jesus)}</textarea>
      <label class="field" for="f_obey">What is God asking of me?</label>
      <textarea class="short" id="f_obey" placeholder="Something to trust, change, give, or do this week…">${esc(e.obey)}</textarea>
      <label class="field" for="f_takeaway">One-sentence takeaway for my life today</label>
      <textarea class="short" id="f_takeaway" placeholder="How does this apply to my life and today’s world?">${esc(e.takeaway)}</textarea>
      <label class="field" for="f_prayer">Prayer</label>
      <textarea id="f_prayer" placeholder="Talk to God about what you read — praise, confession, thanks, requests…">${esc(e.prayer)}</textarea>
      <div class="saved" id="saved"></div>
    </section>`;
  $('#ver').onchange = ev => { prefs.version = ev.target.value; savePrefs(); $('#refs').innerHTML = refsHtml(); };
  $('#delEntry').onclick = () => confirmBox('Delete this entry?', 'This permanently removes it from this device.', () => {
    entries = entries.filter(x => x.id !== e.id); save(); prefs.view='home'; render(); });
  let t;
  ['title','date','scripture','reflection','god','jesus','obey','takeaway','prayer'].forEach(f => $('#f_'+f).addEventListener('input', ev => {
    e[f] = ev.target.value; e.updated = Date.now(); save();
    if (f !== 'title' && f !== 'date') $('#refs').innerHTML = refsHtml();
    $('#saved').textContent = 'Saved privately ✓'; clearTimeout(t); t = setTimeout(() => $('#saved').textContent = '', 1600);
    renderNav();
  }));
}

function render(){ renderNav(); prefs.view === 'entry' ? renderEntry() : renderHome(); savePrefs(); closeMenu(); window.scrollTo(0,0); }
function newEntry(){ const e = { id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), date:today(), title:'', scripture:'', reflection:'', god:'', jesus:'', obey:'', takeaway:'', prayer:'', updated:Date.now() };
  entries.push(e); save(); prefs.current = e.id; prefs.view = 'entry'; render(); setTimeout(() => $('#f_title')?.focus(), 50); }

function confirmBox(title, msg, onYes){
  $('#dlgBody').innerHTML = `<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="dlg-actions"><button class="btn" id="cn">Cancel</button><button class="btn primary" id="cy">Yes</button></div>`;
  $('#cn').onclick = () => $('#dlg').close(); $('#cy').onclick = () => { $('#dlg').close(); onYes(); };
  if (!$('#dlg').open) $('#dlg').showModal();
}

/* Backup / restore — the file stays with the user */
$('#exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ app:'study-journal', kind:'personal', version:2, exported:new Date().toISOString(), entries }, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `my-journal-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (d.app !== 'study-journal' || !Array.isArray(d.entries)) throw 0;
    confirmBox('Restore backup?', `Add ${d.entries.length} entr${d.entries.length===1?'y':'ies'} from the backup? Entries already on this device are kept.`, () => {
      const ids = new Set(entries.map(e => e.id)); d.entries.forEach(e => { if (!ids.has(e.id)) entries.push(e); }); save(); prefs.view='home'; render(); });
  } catch { confirmBox('Not a valid backup', 'Choose a file made with “Back up my journal”.', () => {}); }
  ev.target.value = '';
};

/* Optional passcode lock for shared devices */
const hash = async s => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sj:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); };
$('#lockBtn').onclick = () => {
  const has = !!get(K.lock);
  $('#dlgBody').innerHTML = `<h2>${has ? 'Change passcode' : 'Set a passcode'}</h2>
    <p class="hint">Hides your journal behind a passcode when the app opens. Useful if others use this device.</p>
    <label class="field">New passcode (4+ characters)</label><input type="text" id="pc" inputmode="numeric" autocomplete="off">
    <div class="err" id="pcerr"></div>
    <div class="dlg-actions">${has ? '<button class="btn ghost" id="pcoff" style="margin-right:auto">Remove lock</button>' : ''}<button class="btn" id="pccan">Cancel</button><button class="btn primary" id="pcok">Save</button></div>`;
  $('#dlg').showModal();
  $('#pccan').onclick = () => $('#dlg').close();
  $('#pcok').onclick = async () => { const v = $('#pc').value.trim(); if (v.length < 4) { $('#pcerr').textContent = 'Use at least 4 characters.'; return; } set(K.lock, await hash(v)); $('#dlg').close(); renderNav(); };
  const off = $('#pcoff'); if (off) off.onclick = () => { del(K.lock); $('#dlg').close(); renderNav(); };
};
function showLock(){
  const app = document.querySelector('.app'), top = document.querySelector('.topbar'); app.style.display = 'none'; top.style.visibility = 'hidden';
  const wrap = document.createElement('div'); wrap.className = 'lock-screen';
  wrap.innerHTML = `<p class="brand">Study Journal</p><p class="hint">Enter your passcode to open your journal.</p>
    <input type="password" id="unl" inputmode="numeric" autocomplete="off" aria-label="Passcode"><div class="err" id="unlerr"></div>
    <button class="btn primary" id="unlbtn" style="width:100%">Unlock</button>`;
  document.body.appendChild(wrap);
  const go = async () => { if (await hash($('#unl').value.trim()) === get(K.lock)) { wrap.remove(); app.style.display = ''; top.style.visibility = ''; render(); } else $('#unlerr').textContent = 'That passcode doesn’t match.'; };
  $('#unlbtn').onclick = go; $('#unl').onkeydown = e => e.key === 'Enter' && go(); $('#unl').focus();
}

document.addEventListener('click', ev => {
  if (ev.target.closest('[data-new]')) return newEntry();
  if (ev.target.closest('[data-home]')) { prefs.view='home'; return render(); }
  const eb = ev.target.closest('[data-entry]'); if (eb) { prefs.current = eb.dataset.entry; prefs.view = 'entry'; render(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches('.card[data-entry]')) ev.target.click(); });
$('#search').value = prefs.q;
$('#search').oninput = ev => { prefs.q = ev.target.value; savePrefs(); renderNav(); if (prefs.view === 'home') renderHome(); };
const closeMenu = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); };
$('#menuBtn').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = closeMenu;
get(K.lock) ? showLock() : render();
})();
</script>
</body>
</html>
